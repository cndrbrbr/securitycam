# SecurityCams – Web-Ansicht der Kameras
web:
  # Webserver für die Kameraübersicht (Browser: http://<server>:<port>/?token=<token>)
  enabled: true
  bind: 0.0.0.0
  port: 8090
  # Zugriffsschlüssel; leer = wird beim ersten Start zufällig erzeugt
  token: ""
  # Maximale Anzahl gleichzeitiger Live-Streams
  max-streams: 16

render:
  width: 320
  height: 180
  fps: 4
  # Sichtweite in Blöcken (8–96)
  distance: 48
  fov: 70
  # Wie oft die Blöcke neu eingelesen werden (Sekunden); Spieler/Mobs werden jedes Bild aktualisiert
  block-refresh-seconds: 2.0
