<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecurityCams</title>
<style>
  :root { --bg: #0b0d10; --panel: #14181d; --line: #262c34; --text: #d7dde4; --muted: #7d8794; --live: #e5484d; --ok: #3fb950; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .08em; }
  header .meta { margin-left: auto; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  main { display: grid; gap: 12px; padding: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: zoom-in; }
  .tile img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; image-rendering: pixelated; }
  .tile .bar { display: flex; justify-content: space-between; padding: 7px 10px; color: var(--muted); }
  .tile .bar b { color: var(--text); font-weight: 600; }
  .state.ok { color: var(--ok); } .state.err { color: var(--live); }
  .empty { grid-column: 1 / -1; padding: 48px 16px; text-align: center; color: var(--muted); }
  .full { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
  .full.open { display: flex; }
  .full img { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; }
</style>
</head>
<body>
<header><span class="dot"></span><h1>SECURITYCAMS</h1><span class="meta" id="meta">…</span></header>
<main id="grid"></main>
<div class="full" id="full"><img alt=""></div>
<script>
  const grid = document.getElementById('grid'), meta = document.getElementById('meta');
  const full = document.getElementById('full'), fullImg = full.querySelector('img');
  const tiles = new Map();

  function streamUrl(id) { return '/cam/' + encodeURIComponent(id) + '.mjpg?t=' + Date.now(); }

  function addTile(cam) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.innerHTML = '<img alt=""><div class="bar"><span><b></b> <span class="world"></span></span><span class="state">verbinde…</span></div>';
    const img = tile.querySelector('img'), state = tile.querySelector('.state');
    tile.querySelector('b').textContent = cam.id;
    tile.querySelector('.world').textContent = cam.world;
    img.alt = 'Kamera ' + cam.id;
    img.onload = () => { state.textContent = 'LIVE'; state.className = 'state ok'; };
    img.onerror = () => { state.textContent = 'getrennt'; state.className = 'state err'; setTimeout(() => { if (tiles.has(cam.id)) img.src = streamUrl(cam.id); }, 3000); };
    img.src = streamUrl(cam.id);
    tile.onclick = () => { fullImg.src = streamUrl(cam.id); fullImg.alt = img.alt; full.classList.add('open'); };
    tiles.set(cam.id, tile);
    return tile;
  }

  full.onclick = () => { full.classList.remove('open'); fullImg.removeAttribute('src'); };

  async function refresh() {
    try {
      const res = await fetch('/api/cameras', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const cams = await res.json();
      const ids = new Set(cams.map(c => c.id));
      for (const [id, tile] of tiles) if (!ids.has(id)) { tile.querySelector('img').removeAttribute('src'); tile.remove(); tiles.delete(id); }
      for (const cam of cams) if (!tiles.has(cam.id)) grid.appendChild(addTile(cam));
      grid.querySelector('.empty')?.remove();
      if (!cams.length) grid.innerHTML = '<div class="empty">Keine Kameras. Im Spiel mit /cam create &lt;name&gt; anlegen.</div>';
      meta.textContent = cams.length + (cams.length === 1 ? ' Kamera' : ' Kameras');
    } catch (e) {
      meta.textContent = 'Server nicht erreichbar';
    }
  }

  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
